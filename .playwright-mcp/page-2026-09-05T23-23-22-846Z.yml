    - generic [ref=e13]:
      - generic [ref=e14]: Scaling Multi-Agent Intelligence
      - heading "Teaching Machines to Coordinate" [level=1] [ref=e15]
    - paragraph [ref=e17]: "Multiscalar Intelligence develops new algorithms and systems for multi-agent AI, enabling agents to learn, coordinate, and scale from individuals to open networks. Our work focuses on emerging scaling paradigms for coordination: training agents to reason strategically, enabling collective learning across coalitions, and building the foundations for large-scale coordination in open, adversarial environments."
    - generic [ref=e18]:
      - generic [ref=e19]: Research
      - generic [ref=e20]:
        - generic [ref=e21]:
          - generic [ref=e22]: "01"
          - heading "Strategic Capabilities" [level=3] [ref=e23]
          - paragraph [ref=e24]: Training agents to reason, plan, and act under incentives and uncertainty. We develop methods that go beyond static reasoning, enabling agents to model others, anticipate outcomes, and operate in strategic environments.
        - generic [ref=e25]:
          - generic [ref=e26]: "02"
          - heading "Collective Learning" [level=3] [ref=e27]
          - paragraph [ref=e28]: Extending learning from individuals to groups. We design algorithms that enable agents to learn jointly across coalitions, propagating signals through interactions, aligning behaviors, and improving coordination through shared experience.
        - generic [ref=e29]:
          - generic [ref=e30]: "03"
          - heading "Coordination at Scale" [level=3] [ref=e31]
          - paragraph [ref=e32]: Building the foundations for large-scale, open multi-agent systems. This includes protocols, benchmarks, and infrastructure for coordination in adversarial environments, where agents must discover, interact, and cooperate without central control.
        - generic [ref=e33]:
          - generic [ref=e34]: "04"
          - heading "Security & Safety in Multi-Agent Systems" [level=3] [ref=e35]
          - paragraph [ref=e36]: Designing agents that remain robust, aligned, and trustworthy in open environments. We study adversarial behavior, collusion, and deception, and build trust mechanisms and secure interaction protocols so agent ecosystems can scale safely under real-world incentives.
